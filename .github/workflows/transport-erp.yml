# G Road Lines Transport Agent ERP: tests, Android APK and Windows installer.
# The APK and the installer appear under "Artifacts" on the workflow run page.
name: transport-erp

on:
  push:
    paths: ["transport-erp/**", ".github/workflows/transport-erp.yml"]
  pull_request:
    paths: ["transport-erp/**", ".github/workflows/transport-erp.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: transport-erp

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grl_erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grl_erp_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grl_erp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: transport-erp/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        working-directory: transport-erp/mobile
        run: |
          npm ci
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../GRL-ERP.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GRL-ERP-Android-APK
          path: transport-erp/mobile/GRL-ERP.apk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build installer
        working-directory: transport-erp/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: GRL-ERP-Windows-Installer
          path: transport-erp/desktop/release/*.exe
